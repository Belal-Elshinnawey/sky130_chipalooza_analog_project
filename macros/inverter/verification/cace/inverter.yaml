#--------------------------------------------------------------
# CACE circuit characterization file
#--------------------------------------------------------------

name:           inverter
description:    Inverter macro for the sky130A chip template
PDK:            sky130A

cace_format:    5.2

authorship:
  designer:         Simon Dorrer
  company:          Johannes Kepler University
  creation_date:    May 6, 2026
  license:          Apache-2.0 WITH SHL-2.1

paths:
  root:             ..
  schematic:        ../schematic/xschem
  netlist:          cace/netlist
  documentation:    cace/_docs
  runs:             cace/_runs

pins:
  VDD:
    description: Positive analog power supply
    type: power
    direction: inout
    Vmin: 3.0
    Vmax: 3.6
  VSS:
    description: Analog ground
    type: ground
    direction: inout
  vin:
    description: Inverter input
    type: signal
    direction: input
  vout:
    description: Inverter output
    type: signal
    direction: output

default_conditions:
  vdd:
    description: Analog power supply voltage
    display: VDD
    unit: V
    typical: 3.3
  vcm:
    description: Input common-mode voltage
    display: Vcm
    unit: V
    typical: 1.2
  corner_mos:
    description: Process corner MOSFET
    display: Corner MOSFET
    typical: tt
  corner_r:
    description: Process corner resistor
    display: Corner R
    typical: typical
  temp:
    description: Ambient temperature
    display: Temperature
    unit: °C
    typical: 27
  cload:
    description: Load capacitance
    display: Cload
    unit: pF
    typical: 10
  stat_global:
    description: Enable global process statistical variation
    display: Stat Global
    typical: 0
  stat_mismatch:
    description: Enable local device mismatch statistical variation
    display: Stat Mismatch
    typical: 0

parameters:
  ac_params:
    spec:
      Adc_ol_dB:
        display: Open-loop dc gain
        description: Small-signal open-loop gain at 10Hz
        unit: dB
        minimum:
          value: 2
        typical:
          value: any
        maximum:
          value: any
      fcu:
        display: Upper -3dB cut-off frequency
        description: Upper -3dB cut-off frequency
        unit: Hz
        minimum:
          value: 500000
        typical:
          value: any
        maximum:
          value: any
    tool:
      ngspice:
        template: inverter_tb_ac.sch
        format: ascii
        suffix: .data
        variables: [Adc_ol_dB, fcu]
    plot:
      Adc_ol_dB_vs_vdd:
        type: xyplot
        xaxis: vdd
        yaxis: Adc_ol_dB
        limits: auto
      Adc_ol_dB_vs_vcm:
        type: xyplot
        xaxis: vcm
        yaxis: Adc_ol_dB
        limits: auto
      Adc_ol_dB_vs_corner_mos:
        type: xyplot
        xaxis: corner_mos
        yaxis: Adc_ol_dB
        limits: auto
      Adc_ol_dB_vs_temp:
        type: xyplot
        xaxis: temp
        yaxis: Adc_ol_dB
        limits: auto
      Adc_ol_dB_vs_cload:
        type: xyplot
        xaxis: cload
        yaxis: Adc_ol_dB
        limits: auto
      fcu_vs_vdd:
        type: xyplot
        xaxis: vdd
        yaxis: fcu
        limits: auto
      fcu_vs_vcm:
        type: xyplot
        xaxis: vcm
        yaxis: fcu
        limits: auto
      fcu_vs_corner_mos:
        type: xyplot
        xaxis: corner_mos
        yaxis: fcu
        limits: auto
      fcu_vs_temp:
        type: xyplot
        xaxis: temp
        yaxis: fcu
        limits: auto
      fcu_vs_cload:
        type: xyplot
        xaxis: cload
        yaxis: fcu
        limits: auto
    conditions:
      vdd:
        enumerate: [3.0, 3.1, 3.2, 3.3, 3.4, 3.5, 3.6]
        # typical: 3.3
      vcm:
        # minimum: 0.9
        typical: 1.2
        # maximum: 1.5
      corner_mos:
        # sky130.lib.spice ships these 5 process corner .lib sections (nfet/pfet, any voltage
        # class, selected together): tt, sf, ff, ss, fs. Unlike gf180mcuD's sm141064.ngspice,
        # there is no separate "res_<corner>" resistor axis here -- every corner section above
        # already bundles its own nominal resistor parameters (parameters_res_nom.spice), so
        # corner_r below is kept for parity with the gf180 template but isn't wired into a
        # second .lib call (see templates/inverter_tb_ac.sch).
        enumerate: [ss, sf, tt, fs, ff]
        # typical: tt
      corner_r:
        typical: typical
      temp:
        minimum: -40
        typical: 27
        maximum: 120
      cload:
        #minimum: 1       # 1pF
        typical: 10       # 10pF
        #maximum: 50      # 50pF

  ac_mc_params:
    spec:
      Adc_ol_dB:
        display: Open-loop dc gain - Monte Carlo
        description: Small-signal open-loop gain at 10Hz
        unit: dB
        minimum:
          value: 2
        typical:
          value: any
        maximum:
          value: any
      fcu:
        display: Upper -3dB cut-off frequency - Monte Carlo
        description: Upper -3dB cut-off frequency
        unit: Hz
        minimum:
          value: 500000
        typical:
          value: any
        maximum:
          value: any
    tool:
      ngspice:
        template: inverter_tb_ac.sch
        collate: iterations
        format: ascii
        suffix: .data
        variables: [Adc_ol_dB, fcu]
        script: inverter_tb_ac.py
        script_variables: [Adc_ol_dB_arr, fcu_arr]
    variables:
      Adc_ol_dB_arr:
        display: Open-loop dc gain - Monte Carlo
        unit: dB
      fcu_arr:
        display: Upper -3dB cut-off frequency - Monte Carlo
        unit: Hz
    plot:
      Adc_ol_dB_mc:
        type: histogram
        xaxis: Adc_ol_dB_arr
        title: Open-Loop DC Gain - Monte Carlo
      fcu_mc:
        type: histogram
        xaxis: fcu_arr
        title: Upper -3dB Cut-off Frequency - Monte Carlo
    conditions:
      vdd:
        #minimum: 3.0
        typical: 3.3
        #maximum: 3.6
      vcm:
        #minimum: 0.9
        typical: 1.2
        #maximum: 1.5
      iterations: # for Monte Carlo
        description: Iterations to run
        display: Iterations
        minimum: 1
        maximum: 200
        step: linear
        stepsize: 1
      corner_mos:
        # sky130's statistical/global-variation corner section is named "mc" (sets
        # MC_PR_SWITCH=1, MC_MM_SWITCH=0 by default -- see inverter.yaml's note under
        # ac_params and templates/inverter_tb_ac.sch), unlike gf180mcuD's "statistical" name.
        typical: mc
      corner_r:
        typical: statistical
      stat_global:
        typical: 1
      stat_mismatch:
        typical: 0
      temp:
        minimum: -40
        typical: 27
        maximum: 120
      cload:
        #minimum: 1       # 1pF
        typical: 10       # 10pF
        #maximum: 50      # 50pF

  ac_mm_params:
    spec:
      Adc_ol_dB:
        display: Open-loop dc gain - Mismatch
        description: Small-signal open-loop gain at 10Hz
        unit: dB
        minimum:
          value: 2
        typical:
          value: any
        maximum:
          value: any
      fcu:
        display: Upper -3dB cut-off frequency - Mismatch
        description: Upper -3dB cut-off frequency
        unit: Hz
        minimum:
          value: 500000
        typical:
          value: any
        maximum:
          value: any
    tool:
      ngspice:
        template: inverter_tb_ac.sch
        collate: iterations
        format: ascii
        suffix: .data
        variables: [Adc_ol_dB, fcu]
        script: inverter_tb_ac.py
        script_variables: [Adc_ol_dB_arr, fcu_arr]
    variables:
      Adc_ol_dB_arr:
        display: Open-loop dc gain - Mismatch
        unit: dB
      fcu_arr:
        display: Upper -3dB cut-off frequency - Mismatch
        unit: Hz
    plot:
      Adc_ol_dB_mm:
        type: histogram
        xaxis: Adc_ol_dB_arr
        title: Open-Loop DC Gain - Mismatch
      fcu_mm:
        type: histogram
        xaxis: fcu_arr
        title: Upper -3dB Cut-off Frequency - Mismatch
    conditions:
      vdd:
        #minimum: 3.0
        typical: 3.3
        #maximum: 3.6
      vcm:
        #minimum: 0.9
        typical: 1.2
        #maximum: 1.5
      iterations: # for Mismatch
        description: Iterations to run
        display: Iterations
        minimum: 1
        maximum: 200
        step: linear
        stepsize: 1
      corner_mos:
        typical: mc
      corner_r:
        typical: statistical
      stat_global:
        typical: 0
      stat_mismatch:
        typical: 1
      temp:
        minimum: -40
        typical: 27
        maximum: 120
      cload:
        #minimum: 1       # 1pF
        typical: 10       # 10pF
        #maximum: 50      # 50pF
