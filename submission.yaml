# This is the configuration file for your submission.
# Please edit the fields below to match your project.

project-name: Chipalooza Analog Project (sky130)

# Must be a unique name and must match TOP in the Makefile, the file names in
# layout/, schematic/xschem/ and testbenches/xschem/, and the top cell inside
# the GDS. See "To rename the project" in README.md.
top-cell: "sky130_chipalooza_analog_project"

team-members:
- Firstname Lastname
- Firstname Lastname

# small (500um x 200um), tiny (200um x 200um) or large (500um x 415um).
# Must match the floorplan template this layout was started from.
slot-size: tiny

# Number of analog pins actually used, 0-3.
analog-pins: 3

short-description: sky130 port of the Chipalooza analog-on-top template; awaiting its macro.

# Please add the documentation about your project here.
# Why did you choose to create it? How does it work? How can it be tested, etc.?
# If your project requires additional external hardware, e.g. a USB port,
# please mention this so it can be considered when designing the PCB.
long-description: |
  Ported from the ihp-sg13cmos5l Chipalooza analog-on-top template to the
  SkyWater sky130 Open-PDK (sky130A).

  This port carries over the harness only (Makefiles, .designinit, xschemrc
  chaining, floorplan templates, scripts) with every PDK tool path pointed at
  sky130A. The IHP inverter unit cell and the hand-drawn top-level
  schematic/layout that instantiated it have been removed rather than carried
  over broken, pending the replacement analog macro that will be designed for
  this PDK (see README.md). `macros/counter`'s RTL and testbenches are carried
  over as-is; its LibreLane hardening flow still targets IHP corners/libs and
  needs its own follow-up port, see macros/counter/README.md and
  macros/counter/flow/librelane/config.yaml.

  This file, `gds-path`/`lef-path`/`header-path` below and the fields above
  must be filled in for the real macro once it exists; `make build-top`
  produces nothing until then.

# These paths are used to verify your
# submission during the precheck.
# Wildcards are allowed, but there
# should only be a single match.
# This repository *is* the submission macro, so the paths are relative to the
# repository root rather than to a folder under macros/.
gds-path: final/gds/*.gds
lef-path: final/lef/*.lef
header-path: final/vh/*.vh
